# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 20  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    ee_controller:
      type: joint_trajectory_controller/JointTrajectoryController
 
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    servo_controller:
      type: position_controllers/JointGroupPositionController

arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      #- velocity

ee_controller:
  ros__parameters:
    joints:
      - Active_Scissors_Gear_Joint
      - Door_Joint
      - Iris_Active_Gear_Joint
    command_interfaces:
      - position
    state_interfaces:
      - position
#      - velocity

servo_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6


