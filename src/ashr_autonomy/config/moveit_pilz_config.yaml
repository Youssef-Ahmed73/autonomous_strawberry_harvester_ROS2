autonomy_fsm_node:
  ros__parameters:
    # --------------------------------------------------
    # MoveItCpp Core Settings
    # --------------------------------------------------
    planning_scene_monitor_options:
      name: "planning_scene_monitor"
      robot_description: "robot_description"
      joint_state_topic: "/joint_states"
      attached_collision_object_topic: "/attached_collision_object"
      publish_planning_scene_topic: "/publish_planning_scene"
      monitored_planning_scene_topic: "/monitored_planning_scene"
      wait_for_initial_state_timeout: 10.0

    planning_pipelines:
      pipeline_names: ["pilz_industrial_motion_planner"]

    plan_request_params:
      planning_attempts: 1
      planning_pipeline: "pilz_industrial_motion_planner"
      max_velocity_scaling_factor: 1.0
      max_acceleration_scaling_factor: 1.0

    # --------------------------------------------------
    # Pilz Pipeline Settings & Missing Defaults
    # --------------------------------------------------
    pilz_industrial_motion_planner:
      planning_plugin: "pilz_industrial_motion_planner/CommandPlanner"
      request_adapters: "default_planner_request_adapters/AddTimeOptimalParameterization default_planner_request_adapters/FixWorkspaceBounds default_planner_request_adapters/FixStartStateBounds default_planner_request_adapters/FixStartStateCollision default_planner_request_adapters/FixStartStatePathConstraints"
      default_planner_config: "PTP"
      
      # Suppressing the INFO logs by setting explicitly 
      path_tolerance: 0.1
      resample_dt: 0.1
      min_angle_change: 0.001
      default_workspace_bounds: 10.0
      start_state_max_bounds_error: 0.05
      start_state_max_dt: 0.5
      jiggle_fraction: 0.02
      max_sampling_attempts: 100